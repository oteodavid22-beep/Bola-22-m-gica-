<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bola 22 Mágica</title>
  <meta name="description" content="Bola 22 Mágica - imita la bola mágica retro con modos y compartir" />
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icon.svg">
  <meta name="theme-color" content="#071022">
  <style>
    :root{--bg:#0b1220;--card:#0f1724;--accent:#ffcc00;color:#fff}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:radial-gradient(circle at center,#1b1d28 0%,#08090c 100%);color:#fff;min-height:100vh}
    h1{margin:15px 0 6px;font-size:1.6rem;font-weight:300;letter-spacing:3px;color:#f0f0f0;text-shadow:0 0 10px rgba(255,255,255,.12)}
    #canvas-container{width:100%;height:48vh;display:flex;align-items:center;justify-content:center;cursor:grab}
    #canvas-container:active{cursor:grabbing}
    .ui-container{width:100%;max-width:360px;padding:15px 20px 25px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
    .mode-selector{display:flex;gap:6px;justify-content:space-between;background:rgba(255,255,255,0.04);padding:6px;border-radius:20px;border:1px solid #222}
    .mode-btn{flex:1;padding:8px;border:0;background:transparent;color:#aaa;font-size:12px;font-weight:700;border-radius:14px;cursor:pointer;transition:all .15s}
    .mode-btn.active{background:#fff;color:#111;box-shadow:0 4px 18px rgba(255,255,255,.06)}
    input{width:100%;padding:12px 16px;border-radius:25px;border:1px solid #333;background:rgba(255,255,255,0.04);color:#fff;font-size:14px;text-align:center;outline:none}
    input:focus{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.06)}
    .action-row{display:flex;gap:8px}
    .action-btn{flex:1;padding:12px;border-radius:20px;border:0;background:var(--accent);color:#111;font-weight:800;cursor:pointer}
    .share-btn{background:transparent;border:1px solid rgba(255,255,255,.08);color:#ddd;padding:10px;font-size:13px;display:none}
    .hint{font-size:12px;color:#99a;text-align:center}
    .banner-ad{width:100%;max-width:360px;margin:8px auto;text-align:center;color:#bbb;font-size:12px}
    footer{margin:12px 0 18px;font-size:12px;color:#99a}
  </style>
</head>
<body>
  <h1>BOLA 22 MÁGICA</h1>

  <div id="canvas-container" aria-hidden="true"></div>

  <div class="ui-container">
    <div class="mode-selector" role="tablist" aria-label="Modos">
      <button class="mode-btn active" onclick="setMode('classic', this)">Clásico</button>
      <button class="mode-btn" onclick="setMode('sarcastic', this)">Sarcástico</button>
      <button class="mode-btn" onclick="setMode('mystic', this)">Místico</button>
      <button class="mode-btn" onclick="setMode('motiv', this)">Hype</button>
    </div>

    <input id="question" type="text" placeholder="Escribe tu pregunta de SÍ o NO..." onkeypress="handleKey(event)" aria-label="Pregunta" />

    <div class="action-row">
      <button class="action-btn" onclick="askOracle()">Agitar y Consultar</button>
      <button id="shareBtn" class="share-btn" onclick="shareResult()">Compartir</button>
    </div>

    <div class="hint">Arrastra para girar 360° · Cambia de modo para distintas vibras</div>
  </div>

  <div class="banner-ad" aria-hidden="true">
    <div style="background:rgba(255,255,255,0.02);padding:8px;border-radius:10px">Espacio publicitario</div>
  </div>

  <footer>Hecha con Capacitor · Lista para compilar en Android</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // --- Respuestas por modo ---
  const answerPacks = {
    classic: ["ES CIERTO","SÍ TOTALMENTE","SIN DUDAS","CONFÍA EN ELLO","PARECE QUE SÍ","MUY PROBABLE","SEÑALES APUNTAN SÍ","SÍ","DUDA LUEGO","NO PUEDO PREDECIR","CONCÉNTRATE Y PREGUNTA","REPETIR PREGUNTA","NO CUENTES CON ELLO","MI RESPUESTA ES NO","FUENTES DICEN NO","NO APUNTA BIEN","MUY DUDOSO","DEFINITIVAMENTE NO","NO LO CREO","IMPOSIBLE"],
    sarcastic: ["¿EN SERIO?","NI LO SUEÑES","JAJAJA NO","BUSCA TRABAJO","PREGUNTA OTRA VEZ","OBVIO QUE NO","NO SEA TERCO","CLARO, CAMPEÓN","SUERTE CON ESO","SÍ, EN OTRA VIDA","Y YO SOY UN YETI","MEJOR NO DIGO","¿OTRA VEZ TÚ?","CERO CHANCES","PROBABLEMENTE NO","DÉJAME DORMIR"],
    mystic: ["ALINEACIÓN A FAVOR","EL COSMOS DICE SÍ","SOMBRAS EN DUDA","DESTINO INCIERTO","AURA POSITIVA","ENERGÍA BLOQUEADA","RITUAL INCOMPLETO","SÍ, SE REVELA","SEÑAL OSCURA","FLUJO A FAVOR","NO ES EL MOMENTO","LUNA ADVIERTE NO"],
    motiv: ["¡A POR ELLO!","¡SÍ O SÍ!","¡ROMPE EL LÍMITE!","¡100% SEGURO!","¡MODO BESTIA!","¡NADA TE FRENA!","¡DALE SIN MIEDO!","¡ACELERADORES!","¡RECALCULANDO!","¡CON TODO!","¡HOY SE LOGRA!","¡LLEGA TU HORA!"]
  };

  let currentMode = 'classic';
  let lastAnswer = '';
  let lastQuestion = '';

  function setMode(mode, btn){
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    playButtonClickSound();
  }

  // ---- Three.js scene ----
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / Math.max(container.clientHeight, 200), 0.1, 1000);
  camera.position.z = 6;
  const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true, preserveDrawingBuffer:true});
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const dirLight = new THREE.DirectionalLight(0xffffff,1.0); dirLight.position.set(5,5,5); scene.add(dirLight);

  const ballGroup = new THREE.Group(); scene.add(ballGroup);
  const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(2,64,64), new THREE.MeshStandardMaterial({color:0x800020, roughness:0.1, metalness:0.2}));
  ballGroup.add(ballMesh);

  // white circle with 22
  const canvas22 = document.createElement('canvas'); canvas22.width=512; canvas22.height=512; const ctx22 = canvas22.getContext('2d');
  ctx22.fillStyle='#ffffff'; ctx22.beginPath(); ctx22.arc(256,256,200,0,Math.PI*2); ctx22.fill(); ctx22.fillStyle='#000000'; ctx22.font='Bold 220px Arial'; ctx22.textAlign='center';
